<section id="settings" class="screen" aria-labelledby="settings-title" hidden>
  <form id="settings-form">
    <header class="editor-header">
      <button id="settings-cancel" type="button" class="ghost" data-i18n="cancel">Cancel</button>
      <h2 id="settings-title" data-i18n="settings">Settings</h2>
    </header>
    <div class="budget-fields"></div>
    <button id="settings-submit" type="submit" data-i18n="save">Save</button>
    <div class="data">
      <h2 data-i18n="data">Data</h2>
      <div class="row">
        <button id="export-btn" type="button" class="ghost" data-i18n="export">Export</button>
        <button id="import-btn" type="button" class="ghost" data-i18n="import">Import</button>
      </div>
    </div>
  </form>
</section>
