<section id="expense-screen" class="screen" aria-labelledby="form-title" hidden>
  <form id="expense-form" autocomplete="off">
    <header class="editor-header">
      <button id="exp-cancel" type="button" class="ghost" data-i18n="cancel">Cancel</button>
      <h2 id="form-title" data-i18n="newExpense">New expense</h2>
    </header>
    <label><span data-i18n="amount">Amount</span>
      <span class="amount-wrap">
        <input id="exp-amount" type="number" inputmode="decimal" step="0.01" min="0.01" required>
        <span id="exp-cur" class="cur"></span>
      </span>
    </label>
    <label><span data-i18n="description">Description</span>
      <input id="exp-desc" type="text" maxlength="100" placeholder="Optional" data-i18n-placeholder="optional">
    </label>
    <label><span data-i18n="dateTime">Date &amp; time</span>
      <input id="exp-date" type="datetime-local" required>
    </label>
    <button id="exp-submit" type="submit" data-i18n="add">Add</button>
    <button id="exp-delete" type="button" class="danger" data-i18n="deleteExpense" hidden>Delete expense</button>
  </form>
</section>
